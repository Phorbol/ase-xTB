[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xtb-ase"
version = "0.2.0"
description = "ASE calculators for g-xTB and GFN-FF backends"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ase>=3.20",
  "numpy>=1.23",
]

[project.optional-dependencies]
test = ["pytest>=7"]
gfnff = ["gfnff[ase]>=0.2"]
search = [
  "numba>=0.58",
  "irmsd>=0.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
markers = ["integration: execute an external xTB/GFN-FF backend"]
filterwarnings = [
  "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:ase\\.atoms",
  "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:ase\\.md\\.md",
]
testpaths = ["tests"]
